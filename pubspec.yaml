name: modbus_codec
description: >-
  Transport-agnostic Modbus RTU codec for Dart. Encode request frames, decode
  response bytes into typed values, and reassemble BLE-chunked responses.
version: 0.2.0
repository: https://github.com/anwin-kp/modbus_codec
issue_tracker: https://github.com/anwin-kp/modbus_codec/issues

topics:
  - modbus
  - rtu
  - protocol
  - serial
  - ble

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
